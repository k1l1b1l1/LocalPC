# Production — Raspberry Pi 5. Paths set by ./install.sh into etc/config.yaml

network:
  transport: ego_contract_tcp
  ego_host: "192.168.10.50"   # IP ADSP-SC589 — заменить
  board_control_port: 5000    # SC589 Control TCP (HELLO, START/STOP)
  data_port: 5001             # SC589 Data TCP (EgoFrameHeader + payload)
  max_payload_bytes: 65536

ipc:
  port: 19002

storage:
  data_root: "var/sessions"
  chunk_max_bytes: 4294967296
  chunk_max_sec: 3600
  flush_packets: 1000
  flush_interval_sec: 1
  warn_free_gb: 50
  critical_free_gb: 10
  warn_free_percent: 15
  critical_free_percent: 5

session:
  auto_start_on_session_started: false
  vehicle_id: "CAR-001"
  test_stand_config: "rpi5-field"

diagnostics:
  report_interval_sec: 10
  time_gap_threshold_ms: 50

# После stop/finalize сессии — автоматически запускает ego-offline process (+ S3).
offline:
  enabled: true
  binary: "../offline/bin/ego-offline"
  config: "../offline/etc/config.yaml"
  s3_config: "../offline/etc/s3.local.yaml"
  skip_s3: false
