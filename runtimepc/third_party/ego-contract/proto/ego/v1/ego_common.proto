syntax = "proto3";

package ego.v1;

// Common enums and reusable messages for ADSP-SC589 ego acquisition protocol.

enum FramePayloadType {
  FRAME_PAYLOAD_TYPE_UNSPECIFIED = 0;

  // Session/config frames sent on Data TCP.
  FRAME_PAYLOAD_TYPE_SESSION_STARTED = 1;
  FRAME_PAYLOAD_TYPE_CONFIG_SNAPSHOT = 2;

  // Realtime measurement frames.
  FRAME_PAYLOAD_TYPE_AUDIO_BLOCK = 100;
  FRAME_PAYLOAD_TYPE_IMU_WINDOW = 101;
  FRAME_PAYLOAD_TYPE_CAN_DECODED_VALUE = 102;
  FRAME_PAYLOAD_TYPE_CAN_RAW_FRAME = 103;
  FRAME_PAYLOAD_TYPE_TRAJECTORY_POINT = 104;
  FRAME_PAYLOAD_TYPE_GPS_FIX = 105;

  // Service/event frames.
  FRAME_PAYLOAD_TYPE_TIME_STATUS = 200;
  FRAME_PAYLOAD_TYPE_SYSTEM_STATUS = 201;
  FRAME_PAYLOAD_TYPE_IMU_CALIBRATION_EVENT = 202;
  FRAME_PAYLOAD_TYPE_MARKER_EVENT = 203;

  FRAME_PAYLOAD_TYPE_SESSION_ENDED = 900;
}

enum ConfigType {
  CONFIG_TYPE_UNSPECIFIED = 0;
  CONFIG_TYPE_AUDIO = 1;
  CONFIG_TYPE_IMU = 2;
  CONFIG_TYPE_CAN = 3;
  CONFIG_TYPE_GPS = 4;
  CONFIG_TYPE_VEHICLE = 5;
  CONFIG_TYPE_TIME = 6;
  CONFIG_TYPE_NETWORK = 7;
}

enum ConfigState {
  CONFIG_STATE_UNSPECIFIED = 0;
  CONFIG_STATE_DEFAULT = 1;      // Default config bundled with firmware.
  CONFIG_STATE_USER_SAVED = 2;   // User config saved on SD card.
  CONFIG_STATE_MISSING = 3;
  CONFIG_STATE_INVALID = 4;
}

enum ResultCode {
  RESULT_CODE_UNSPECIFIED = 0;
  RESULT_CODE_OK = 1;
  RESULT_CODE_REJECTED = 2;
  RESULT_CODE_INVALID_ARGUMENT = 3;
  RESULT_CODE_NOT_READY = 4;
  RESULT_CODE_STORAGE_ERROR = 5;
  RESULT_CODE_BUSY = 6;
  RESULT_CODE_UNSUPPORTED = 7;
}

enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_EGO = 1;
  DEVICE_ROLE_SOURCE = 2;
  DEVICE_ROLE_BENCH = 3;
}

enum SampleFormat {
  SAMPLE_FORMAT_UNSPECIFIED = 0;
  SAMPLE_FORMAT_INT16 = 1;
  SAMPLE_FORMAT_INT24_IN_I32 = 2;
  SAMPLE_FORMAT_INT32 = 3;
  SAMPLE_FORMAT_FLOAT32 = 4;
}

enum AudioLayout {
  AUDIO_LAYOUT_UNSPECIFIED = 0;
  AUDIO_LAYOUT_INTERLEAVED = 1;
  AUDIO_LAYOUT_PLANAR = 2;
}

enum ByteOrder {
  BYTE_ORDER_UNSPECIFIED = 0;
  BYTE_ORDER_LITTLE_ENDIAN = 1;
  BYTE_ORDER_BIG_ENDIAN = 2;
}

enum CanSignalRole {
  CAN_SIGNAL_ROLE_UNSPECIFIED = 0;
  CAN_SIGNAL_ROLE_ANY = 1;
  CAN_SIGNAL_ROLE_BASE_SPEED = 2;
  CAN_SIGNAL_ROLE_GEAR_MODE = 3;
  CAN_SIGNAL_ROLE_STEER_ANGLE = 4;
}

enum GpsFixType {
  GPS_FIX_TYPE_UNSPECIFIED = 0;
  GPS_FIX_NONE = 1;
  GPS_FIX_2D = 2;
  GPS_FIX_3D = 3;
  GPS_FIX_DGNSS = 4;
  GPS_FIX_RTK_FLOAT = 5;
  GPS_FIX_RTK_FIXED = 6;
}

enum TimeSource {
  TIME_SOURCE_UNSPECIFIED = 0;
  TIME_SOURCE_INTERNAL = 1;
  TIME_SOURCE_GPS = 2;
  TIME_SOURCE_PTP = 3;
  TIME_SOURCE_EXTERNAL = 4;
}

message Uuid128 {
  fixed64 hi = 1;
  fixed64 lo = 2;
}

message TimeRangeNs {
  fixed64 t0_ns = 1;
  fixed64 t1_ns = 2;
}

message Pose3f {
  float x_m = 1;
  float y_m = 2;
  float z_m = 3;
  float yaw_rad = 4;
  float pitch_rad = 5;
  float roll_rad = 6;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message CanValueDescription {
  uint32 value_id = 1;
  string name = 2;
  string description = 3;
  string unit = 4;
  CanSignalRole role = 5;
  uint32 can_id = 6;
  bool is_extended = 7;
}

message ErrorInfo {
  ResultCode code = 1;
  string message = 2;
  repeated ConfigType missing_configs = 3;
  repeated ConfigType invalid_configs = 4;
}

message SoftwareInfo {
  string firmware_version = 1;
  string build_id = 2;
  string git_commit = 3;
  string build_time_utc = 4;
  string base_project = 5;      // sam-audio-starter
  string protocol_version = 6;
}

message DeviceIdentity {
  string device_id = 1;
  DeviceRole device_role = 2;
  string board = 3;             // ADSP-SC589-MINI
  string serial_number = 4;
  SoftwareInfo software = 5;
}

message ConfigStatusItem {
  ConfigType type = 1;
  ConfigState state = 2;
  fixed64 version = 3;
  fixed64 saved_at_ns = 4;
  fixed32 crc32 = 5;
  string description = 6;
}

message ConfigInventory {
  repeated ConfigStatusItem items = 1;
}
